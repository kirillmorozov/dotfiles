#:schema https://developers.openai.com/codex/config-schema.json
approvals_reviewer = "auto_review"
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"
personality = "pragmatic"
plan_mode_reasoning_effort = "high"
web_search = "live"

[features]
apps = false
goals = true
terminal_resize_reflow = true

[tui]
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "current-dir",
  "git-branch",
  "five-hour-limit",
]
session_picker_view = "comfortable"
theme = "ansi"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4

[notice]
fast_default_opt_out = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.5"

[marketplaces.antonbabenko]
source_type = "git"
source = "https://github.com/antonbabenko/agent-plugins.git"

[marketplaces.fluxcd]
source_type = "git"
source = "https://github.com/fluxcd/agent-skills.git"

[marketplaces.i-have-adhd]
source_type = "git"
source = "https://github.com/ayghri/i-have-adhd.git"
ref = "main"

[marketplaces.personal]
source_type = "git"
source = "git@github.com:kirillmorozov/agentic.git"
ref = "refactor/plugin-hooks"

[plugins."skills@personal"]
enabled = true

