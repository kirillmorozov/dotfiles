#:schema https://developers.openai.com/codex/config-schema.json
approvals_reviewer = "auto_review"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
model_reasoning_summary = "concise"
model_verbosity = "low"
personality = "pragmatic"
plan_mode_reasoning_effort = "high"
web_search = "live"

[features]
apps = false
goals = true
terminal_resize_reflow = true

[tui]
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "current-dir",
  "git-branch",
  "five-hour-limit",
]
session_picker_view = "comfortable"
theme = "ansi"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[notice]
fast_default_opt_out = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.5"

[marketplaces.antonbabenko]
source_type = "git"
source = "https://github.com/antonbabenko/agent-plugins.git"

[marketplaces.fluxcd]
source_type = "git"
source = "https://github.com/fluxcd/agent-skills.git"

[marketplaces.personal]
source_type = "git"
source = "git@github.com:kirillmorozov/agentic.git"

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[plugins."go@personal"]
enabled = true

[plugins."shell@personal"]
enabled = true

[plugins."skills@personal"]
enabled = true

[plugins."terraform-skill@antonbabenko"]
enabled = true

[plugins."gitops-skills@fluxcd"]
enabled = true

[plugins."atlassian-rovo@openai-curated-remote"]
enabled = false

[plugins."ponytail@ponytail"]
enabled = true

