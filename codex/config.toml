#:schema https://developers.openai.com/codex/config-schema.json
approvals_reviewer = "auto_review"
model = "gpt-6-sol"
model_reasoning_effort = "medium"
model_reasoning_summary = "concise"
model_verbosity = "low"
personality = "pragmatic"
plan_mode_reasoning_effort = "high"
web_search = "live"

[features]
apps = false
goals = true
terminal_resize_reflow = true

[tui]
screen_reader_detection_done = true
session_picker_view = "comfortable"
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "current-dir",
  "git-branch",
  "five-hour-limit",
]
theme = "ansi"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4

[notice]
fast_default_opt_out = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.5"

[marketplaces.antonbabenko]
source = "https://github.com/antonbabenko/agent-plugins.git"
source_type = "git"

[marketplaces.fluxcd]
source = "https://github.com/fluxcd/agent-skills.git"
source_type = "git"

[marketplaces.i-have-adhd]
source = "https://github.com/ayghri/i-have-adhd.git"
source_type = "git"

[marketplaces.personal]
source = "git@github.com:kirillmorozov/agentic.git"
source_type = "git"

[marketplaces.goland-codex-marketplace]
source = "https://github.com/JetBrains/go-modern-guidelines.git"
source_type = "git"

[marketplaces.ponytail]
source = "https://github.com/DietrichGebert/ponytail.git"
source_type = "git"

[plugins."skills@personal"]
enabled = true

[plugins."terraform-skill@antonbabenko"]
enabled = true

[plugins."gitops-skills@fluxcd"]
enabled = true

[plugins."i-have-adhd@i-have-adhd"]
enabled = true

