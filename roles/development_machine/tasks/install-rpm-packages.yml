---
- name: Add GitHub CLI repository
  become: true
  ansible.builtin.yum_repository:
    baseurl: https://cli.github.com/packages/rpm
    description: GitHub CLI
    gpgkey: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    name: gh-cli
    state: present
- name: Add Librewolf repository
  become: true
  ansible.builtin.yum_repository:
    baseurl: https://repo.librewolf.net
    description: LibreWolf Software Repository
    gpgkey: https://repo.librewolf.net/pubkey.gpg
    name: librewolf
    state: present
- name: Enable Wezterm Copr
  become: true
  community.general.copr:
    name: wezfurlong/wezterm-nightly
- name: Enable Ghostty Copr
  become: true
  community.general.copr:
    name: scottames/ghostty
- name: Enable Starship Copr
  become: true
  community.general.copr:
    name: atim/starship
- name: Enable Jujutsu Copr
  become: true
  community.general.copr:
    name: aldantanneo/jj-vcs
- name: Configure DNF
  become: true
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: "{{ item.key }}"
    value: "{{ item.value | string }}"
    no_extra_spaces: true
    mode: '0644'
  loop:
    - {key: fastestmirror, value: true}
    - {key: max_parallel_downloads, value: 10}
- name: Uninstall bloat
  become: true
  ansible.builtin.dnf5:
    state: absent
    pkg:
      - '@firefox'
      - '@kde-apps'
      - '@kde-media'
      - '@kde-pim'
      - '@libreoffice'
      - firefox
      - kde-connect
      - kde-connect-libs
      - kdeconnectd
      - krfb
      - krfb-libs
      - kwalletmanager5
      - kwrite
- name: Install packages
  become: true
  ansible.builtin.dnf5:
    state: present
    pkg:
      - alacritty
      - btop
      - difftastic
      - eza
      - fd-find
      - fish
      - fzf
      - gh
      - ghostty
      - git
      - glab
      - go-task
      - golang
      - gopls
      - helix
      - jj-cli
      - jq
      - librewolf
      - neovim
      - podman
      - ripgrep
      - starship
      - tree-sitter-cli
      - uv
      - vim
      - vim-X11
      - wezterm
      - yq
